<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>GIFizer 200×200</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>GIFizer 200×200</h1>
    <p>Selecione uma imagem (Max 4MB) e faremos um GIF 200×200 na Vercel.</p>
    <input type="file" id="file" accept="image/*" />
    <button id="uploadBtn">Processar</button>
    <div id="status"></div>
    <div id="result" style="margin-top: 20px;"></div>
  </main>
  <script>
    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('file');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      result.innerHTML = '';
      
      if(!fileInput.files.length){ alert('Escolha um arquivo.'); return; }
      
      const file = fileInput.files[0];
      
      // Limite da Vercel para Serverless Functions é 4.5MB
      if(file.size > 4 * 1024 * 1024) {
        status.textContent = 'Erro: A imagem deve ter menos de 4MB para a Vercel.';
        return;
      }

      status.textContent = 'Lendo imagem...';
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Image = e.target.result.split(',')[1];
        status.textContent = 'Processando no servidor da Vercel...';
        
        try {
          const res = await fetch('/api/process', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageBase64: base64Image })
          });
          
          if(!res.ok) throw new Error('Falha no processamento da Vercel');
          
          const data = await res.json();
          result.innerHTML = `
            <p>Feito! Aqui está o seu GIF:</p>
            <img src="data:image/gif;base64,${data.gifBase64}" alt="GIF 200x200" style="border-radius: 8px;"/>
          `;
          status.textContent = 'Concluído.';
        } catch(err) {
          status.textContent = 'Erro: ' + err.message;
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
